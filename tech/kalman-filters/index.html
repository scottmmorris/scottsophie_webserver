<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The incredible usefulness of Kalman filters | Scott &amp; Sophie</title>
  <link rel="icon" href="../../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/src/site.css">
</head>
<body class="tech-page">
  <a class="back" href="../">&larr; Tech</a>
  <main class="column wide">
    <h1>The incredible usefulness of Kalman filters</h1>
    <p>Every sensor is a little wrong. I can't count how many times my GPS has led me astray. Try driving this car around the obstacles!</p>
    <p class="controls"><kbd>&uarr;</kbd> accelerate &nbsp; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> steer &nbsp;</p>

    <div class="sim-window">
      <canvas id="sim" width="800" height="500" aria-label="Top-down view of a car you can drive with the arrow keys"></canvas>
      <p id="result" aria-live="polite"></p>
    </div>

    <ul class="legend">
      <li><i style="background:#ff0000"></i>Where the sensors reported you went</li>
      <li><i style="background:#2bff00"></i>Where you actually went</li>
    </ul>
    <button id="again" type="button">Drive again</button>
  </main>
  <script type="module" src="/src/kalman.js"></script>
</body>
</html>
